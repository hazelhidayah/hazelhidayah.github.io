<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Hazel Hidayah animated profile banner for dark mode</title>
  <desc id="desc">An editorial animated banner introducing Hazel as a coder, designer, and storyteller.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff796d"/>
      <stop offset="1" stop-color="#ffb36b"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="900" height="380" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="380" fill="#0d1117"/>

    <g fill="none" stroke="#30363d" stroke-width="1" opacity="0.7">
      <path d="M0 48H900M0 96H900M0 144H900M0 192H900M0 240H900M0 288H900M0 336H900"/>
      <path d="M90 0V380M180 0V380M270 0V380M360 0V380M450 0V380M540 0V380M630 0V380M720 0V380M810 0V380"/>
    </g>

    <circle cx="786" cy="118" r="72" fill="none" stroke="#ff796d" stroke-width="1" opacity="0.22">
      <animate attributeName="r" values="58;78;58" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.32;0.08;0.32" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="786" cy="118" r="40" fill="#ff796d" opacity="0.06">
      <animate attributeName="r" values="34;49;34" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.03;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>

    <path d="M653 118C695 70 739 70 786 118C833 166 869 157 914 109" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="310" stroke-dashoffset="310">
      <animate attributeName="stroke-dashoffset" values="310;0;0;-310" keyTimes="0;0.35;0.75;1" dur="6s" repeatCount="indefinite"/>
    </path>

    <g transform="translate(54 48)">
      <text x="0" y="0" fill="#ff796d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">HELLO, I&apos;M</text>
      <text x="0" y="68" fill="#f0f6fc" font-family="Georgia, Times New Roman, serif" font-size="64" font-weight="600" letter-spacing="-2">Hazel Hidayah.</text>

      <g transform="translate(2 103)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">
        <text fill="#c9d1d9">CODER
          <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.34;0.61;0.67;0.94;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
        <text fill="#c9d1d9" opacity="0">DESIGNER
          <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.28;0.34;0.61;0.67;0.94;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
        <text fill="#c9d1d9" opacity="0">STORYTELLER
          <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.28;0.34;0.61;0.67;0.94;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
        <rect x="58" y="-13" width="2" height="17" fill="#ff796d">
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="x" values="58;58;92;92;116;116" keyTimes="0;0.28;0.34;0.61;0.67;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/>
        </rect>
      </g>

      <text x="0" y="148" fill="#8b949e" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">Building thoughtful digital experiences with code, design, and curiosity.</text>
      <rect x="0" y="166" width="350" height="2" rx="1" fill="#30363d"/>
      <rect x="0" y="166" width="0" height="2" rx="1" fill="url(#accent)">
        <animate attributeName="width" values="0;350;350;0" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(786 118)">
      <circle r="8" fill="#ff796d"/>
      <circle cx="0" cy="-54" r="4" fill="#ffb36b">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <line x1="54" y1="244" x2="846" y2="244" stroke="#30363d" stroke-width="1"/>
    <g transform="translate(54 273)" fill="#c9d1d9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
      <text x="0" y="0">I&apos;m a Computer Science student at NUS. I used to study Mass Communication at Ngee Ann Polytechnic,</text>
      <text x="0" y="24">so most of my time now has been dedicated to beating imposter syndrome! I find anything design &amp;</text>
      <text x="0" y="48">computer related <tspan font-style="italic">fascinating</tspan> so I dedicate my life to learning everything I can and nerding out about it :)</text>
      <text x="0" y="84" fill="#ff796d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1">Thanks for stopping by xoxo 🖤</text>
    </g>
  </g>
</svg>
