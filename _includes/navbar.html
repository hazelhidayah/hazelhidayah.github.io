<header class="site-header">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="brand-mark" aria-label="Hazel Hidayah — home">
      <span class="brand-monogram">HH<span>.</span></span>
    </a>

    <nav class="main-nav" aria-label="Primary navigation">
      <ul>
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
        <li><a href="{{ '/works/' | relative_url }}">Work</a></li>
        <li><a href="{{ '/experiences/' | relative_url }}">Experience</a></li>
      </ul>
    </nav>

    <div class="nav-social">
      {% if site.github_username %}
      <a
        href="https://github.com/{{ site.github_username }}"
        class="icon-link"
        aria-label="GitHub"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fab fa-github"></i>
      </a>
      {% endif %}
      {% if site.linkedin_url %}
      <a
        href="{{ site.linkedin_url }}"
        class="icon-link"
        aria-label="LinkedIn"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fab fa-linkedin-in"></i>
      </a>
      {% endif %}
      <a href="{{ '/#contact' | relative_url }}" class="nav-cta">Let’s talk</a>
    </div>
  </div>
</header>
