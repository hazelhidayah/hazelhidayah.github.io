<header class="site-header">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="brand-mark" aria-label="Hazel Hidayah — home">
      {% include seal.html class="seal--nav" %}
    </a>

    <nav class="main-nav" aria-label="Primary navigation">
      <ul>
        <li><a href="{{ '/about/' | relative_url }}" data-nav-section="about-preview"{% if page.url == '/about/' %} class="is-active" aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/works/' | relative_url }}" data-nav-section="selected-work"{% if page.url == '/works/' %} class="is-active" aria-current="page"{% endif %}>Work</a></li>
        <li><a href="{{ '/experiences/' | relative_url }}"{% if page.url == '/experiences/' %} class="is-active" aria-current="page"{% endif %}>Experience</a></li>
      </ul>
    </nav>

    <div class="nav-social">
      {% if site.github_username %}
      <a
        href="https://github.com/{{ site.github_username }}"
        class="icon-link"
        aria-label="GitHub"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fab fa-github" aria-hidden="true"></i>
      </a>
      {% endif %}
      {% if site.linkedin_url %}
      <a
        href="{{ site.linkedin_url }}"
        class="icon-link"
        aria-label="LinkedIn"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fab fa-linkedin-in" aria-hidden="true"></i>
      </a>
      {% endif %}
      <a href="{{ '/#contact' | relative_url }}" class="nav-cta" data-nav-section="contact">Let’s talk</a>
    </div>
  </div>
</header>
